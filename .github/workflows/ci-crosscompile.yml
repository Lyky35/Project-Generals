name: "Build RTS.exe (Linux Cross-Compile)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-rts:
    name: "Full MinGW CMake build"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install MinGW-w64 + build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-x86-64 \
            mingw-w64-tools \
            cmake \
            ninja-build \
            glslang-tools

      - name: "Verify compiler"
        run: x86_64-w64-mingw32-g++ --version | head -1

      - name: "Configure (Release / MinGW cross)"
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/x86_64-w64-mingw32-g++

      - name: "Build library targets"
        run: |
          cmake --build build -j"$(nproc)" --target \
            GameEngine \
            GameEngineDevice \
            WW3D2 \
            VulkanRenderer \
            WWAudio \
            WPAudio \
            Compression \
            Benchmark

      - name: "Link RTS.exe"
        run: cmake --build build -j"$(nproc)" --target RTS

      - name: "Verify PE32+ executable + imports"
        run: |
          file build/bin/RTS.exe
          x86_64-w64-mingw32-objdump -p build/bin/RTS.exe | grep 'DLL Name'
          test -f build/bin/RTS.exe
          echo "RTS.exe linked successfully"

      - name: "Upload RTS.exe artifact"
        uses: actions/upload-artifact@v4
        with:
          name: RTS-mingw-x64
          path: |
            build/bin/RTS.exe
            third_party/openal/OpenAL32.dll
            third_party/vulkan/vulkan-1.dll
          if-no-files-found: error
